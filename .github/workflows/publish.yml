name: Publish mihomo to npm

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # Required to publish via npm Trusted Publishers (OIDC) instead of a token
  id-token: write

concurrency:
  group: publish-mihomo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Skips anything already on the registry, binaries included, so a
      # partially published release is resumed by re-running this job.
      - name: Sync packages
        run: node scripts/sync.js

      # The platform packages come first, and a version that appeared on the
      # registry in the meantime is left alone.
      - name: Publish packages
        run: |
          while IFS=$'\t' read -r dir name version; do
            if npm view "${name}@${version}" version >/dev/null 2>&1 </dev/null; then
              echo "already published: ${name}@${version}"
            else
              npm publish "publish/${dir}" --access public --provenance </dev/null
            fi
          done < publish/.packages
