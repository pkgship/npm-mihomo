name: Publish mihomo to npm

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # Required to publish via npm Trusted Publishers (OIDC) instead of a token
  id-token: write

concurrency:
  group: publish-mihomo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Sync and publish
        run: node scripts/sync.mjs
